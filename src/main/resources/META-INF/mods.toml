modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="polymorphed_delight.png"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="farmersdelight"
mandatory=true
versionRange="${farmers_delight_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="polymorph"
mandatory=true
versionRange="${polymorph_version_range}"
ordering="AFTER"
side="BOTH"
