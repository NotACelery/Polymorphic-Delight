modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="polymorphed_delight.png"
logoBlur=false

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="farmersdelight"
type="required"
reason="Polymorphic Delight integrates Farmer's Delight cooking systems."
versionRange="${farmers_delight_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="polymorph"
type="required"
reason="Required recipe-selection provider. Polymorph+ supplies the polymorph alias."
versionRange="${polymorph_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="polymorph_plus"
type="optional"
reason="Polymorph+ is detected explicitly for provider ordering and diagnostics."
versionRange="${polymorph_plus_version_range}"
ordering="AFTER"
side="BOTH"
