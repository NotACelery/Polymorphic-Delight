plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { polymorphic_delight { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:farmers-delight-398521:${farmers_delight_curse_file}")
    implementation fg.deobf("curse.maven:polymorph-388800:${polymorph_curse_file}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'polymorphic_delight.refmap.json'
    config 'polymorphic_delight.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [minecraft_version: minecraft_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description, farmers_delight_version_range: farmers_delight_version_range,
        polymorph_version_range: polymorph_version_range]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    archiveFileName.set("${mod_id}-${mod_version}-forge-${minecraft_version}.jar")
    manifest {
        attributes(['Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
            'Specification-Version': '1', 'Implementation-Title': project.name,
            'Implementation-Version': archiveVersion, 'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'polymorphic_delight.mixins.json'])
    }
    finalizedBy 'reobfJar'
}
